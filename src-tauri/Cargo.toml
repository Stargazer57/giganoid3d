[package]
name = "giganoid3d"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol = serve the game from inside the exe (no dev server, no localhost)
tauri = { version = "2", features = ["custom-protocol"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
